name = "help-wanted-intake"
main = "worker.js"
compatibility_date = "2026-08-10"

# ⚠ 여기에 키를 적지 않는다. 키는 시크릿으로만 들어간다:
#     wrangler secret put LLM_API_KEY
# 저장소는 공개이고 이 파일은 커밋된다 (ADR-003 D2).
[vars]
# nvidia (1순위) | openai (예비). 공급자 전환은 클라이언트 코드가 아니라 여기다.
PROVIDER = "nvidia"
MODEL = "meta/llama-3.1-70b-instruct"

# 게임 본체가 뜨는 출처만 연다. 쉼표로 구분한다.
#   - GitHub Pages 배포본
#   - 로컬 vite dev (5173) / 프로토타입 정적 서버 (8789)
ALLOWED_ORIGINS = "https://minsu42.github.io,http://localhost:5173,http://localhost:8789"

# 남용 방어 (D2). 격리 단위 best-effort라는 한계는 worker.js의 checkRateLimit 주석 참조.
RATE_LIMIT_PER_MINUTE = "20"
DAILY_CALL_CAP = "3000"

TEMPERATURE = "0.9"
MAX_TOKENS = "500"
