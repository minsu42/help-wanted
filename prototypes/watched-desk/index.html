<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>청취 프로토 5 — 의뢰인이 내 책상을 본다</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header>
  <h1>청취 프로토 5 — 의뢰인이 내 책상을 본다 <span class="rev">3회차</span></h1>
  <div class="hud">
    <label>의뢰인
      <select id="occ"><option>주민</option><option>상인</option>
        <option selected>관리</option><option>귀족</option><option>갱단</option></select>
    </label>
    <label>시드 <input id="seed" type="number" value="7"></label>
    <label title="헛발(틀린 건네기·들이대기)만 깎는다 — v6.1">인내 <input id="tk" type="number" value="3" min="1" max="12"></label>
    <label title="Q7 — 앉자마자 어디까지 스스로 말하는가">털어놓기
      <select id="depth"><option>전부</option><option>1단만</option><option>최소</option></select></label>
    <button id="restart">새 의뢰인</button>
    <label class="peek"><input type="checkbox" id="debug"> 정답 보기</label>
    <span id="llm-state" class="llm-state">…</span>
  </div>
</header>

<main>
  <div class="stage">
    <!-- 상단 가운데: 창구 + 의뢰인. 손에 든 것을 여기 놓으면 「건넨다」(일깨우기) -->
    <section class="counter" id="client-zone" title="손에 든 것을 여기 놓으면 건넨다">
      <div class="win">
        <div class="face" id="face"></div>
        <div class="who" id="who"></div>
        <div class="patience" id="patience" title="이 사람의 인내"></div>
        <div class="drop-hint" id="counter-hint">건넨다 — 창구 너머로 밀어 준다</div>
      </div>
    </section>

    <!-- 대화 리본 — 대화가 주인공이다 (3회차: 오른쪽 구석 → 무대 중앙) -->
    <section class="dialog" id="dialog"></section>

    <!-- 하단: 책상. 왼쪽 의뢰서, 오른쪽 길드마스터북 -->
    <section class="desk">
      <div class="paper">
        <h2>의 뢰 서</h2>
        <div id="form"></div>
        <div class="paper-tools">
          <button id="wait" class="tool" title="아무 말 없이 기다린다">⏳ 기다린다</button>
          <button id="stamp" class="tool stamp-btn">도장에 손을 얹는다</button>
        </div>
      </div>
      <div class="book">
        <h2>길드마스터북 <span class="cnt" id="nb-cnt"></span></h2>
        <div class="tabs" id="tabs"></div>
        <div id="book-items"></div>
      </div>
    </section>
  </div>

  <aside class="panel">
    <h2>손에 든 것</h2>
    <div id="hand" class="hand"><p class="sys">비어 있다. 책의 항목을 집어 보라.</p></div>

    <h2>진행 기록</h2>
    <div id="log"></div>
    <p class="hint">칸을 눌러 묻고(공짜), 책 항목을 집어 창구에 놓으면 건네고,
      막힌 칸에 놓으면 들이댄다. 헛발만 인내를 깎는다.</p>
  </aside>
</main>

<script src="config.js"></script>
<script src="data.js?v=1"></script>
<script src="llm.js?v=2"></script>
<script src="app.js?v=3"></script>
</body>
</html>
